name: Deploy Spanish ProtoWiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Extract participant prototype source
        run: unzip -q prototype-source.zip
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Install dependencies
        working-directory: prototype
        run: npm ci
      - name: Build Spanish participant prototype
        working-directory: prototype
        run: npm run build:vite
        env:
          PROTOWIKI_BASE: /${{ github.event.repository.name }}/
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: prototype/dist
          force: false
